name: Build Pixel
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Mac signatures and launch
        if: matrix.target == 'mac'
        run: |
          codesign --verify --deep --strict dist/mac-arm64/Pixel.app
          codesign --verify --deep --strict dist/mac/Pixel.app
          if [ "$(uname -m)" = "arm64" ]; then dist/mac-arm64/Pixel.app/Contents/MacOS/Pixel --smoke-test; else dist/mac/Pixel.app/Contents/MacOS/Pixel --smoke-test; fi
      - name: Launch Windows smoke test
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/win-unpacked/Pixel.exe" -ArgumentList "--smoke-test" -Wait -PassThru -RedirectStandardOutput "smoke.txt" -RedirectStandardError "smoke-error.txt"
          Get-Content smoke.txt
          Get-Content smoke-error.txt
          if ($app.ExitCode -ne 0) { exit $app.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
          gh release create "$TAG" artifacts/* --verify-tag --title "Pixel $TAG" --generate-notes
